[project]
name = "equity-model"
version = "0.1.0"
description = "Equity Model — Monte Carlo Simulation for Equity Pricing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [  
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "plotly>=6.5.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[tool.mypy]
mypy_path = "src"
packages = ["equity_model"]
exclude = ["^tests/", "^docs/"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = []



[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=8.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.2",
    "mkdocstrings[python]>=1.0.3",
    "mypy>=1.19.1",
]
