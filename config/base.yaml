# config/base.yaml

# =============================================================================
# Base Configuration
# Общие настройки, пути, логирование
# =============================================================================

version: 0.2.0
last_updated: 2026-03-12

# Пути
paths:
  raw_data: data/raw
  processed_data: data/processed
  output: output
  logs: logs

# Календарь
calendar:
  trading_days_per_year: 247
  exchange: MOEX

# Логирование
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: logs/pipeline.log

# Версионирование
model:
  name: Equity Model
  version: 0.2.0
  stages:
    - stage_1_data
    - stage_2_clustering
    - stage_3_calibration