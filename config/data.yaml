# config/data.yaml
# =============================================================================
# Data Configuration
# Источники данных, валидация, загрузка
# =============================================================================


min_history_years: 2
test_window_days: 365
walk_forward_step: 30
walk_forward_folds: 10
liquidity_threshold: 0.20
max_forward_fill_days: 5
  
source: moex
  
moex:
  exchange: MOEX
  market: stock
  engine: stock
  board: TQBR
    
bank_storage:
  host: internal-db.vtb.ru
  port: 5432
  database: market_data
  schema: equity
  table: daily_prices
  auth_method: kerberos

validation:
  min_history_days: 30
  max_missing_ratio: 0.50
  min_liquidity_ratio: 0.20