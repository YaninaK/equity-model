# config/risk.yaml
# =============================================================================
# Risk Configuration (Этап 2)
# Параметры риска, ликвидности, кризисных режимов
# =============================================================================

# -----------------------------------------------------------------------------
# CONSERVATIVE — Консервативные множители по группам истории
# -----------------------------------------------------------------------------
conservative:
  group_A:
    beta_multiplier: 1.30  # Группа A (< 30 дней)
    sigma_multiplier: 1.20
    description: "Минимум данных, высокая неопределённость"
    
  group_B:
    beta_multiplier: 1.20  # Группа B (30–100 дней)
    sigma_multiplier: 1.10
    description: "Недостаточно для EWMA"
    
  group_C:
    beta_multiplier: 1.05  # Группа C (100–200 дней)
    sigma_multiplier: 1.05
    description: "Переходная группа"
    
  group_D:
    beta_multiplier: 1.00  # Группа D (200+ дней)
    sigma_multiplier: 1.00
    description: "Эталонная группа (полная история)"

# -----------------------------------------------------------------------------
# LIQUIDITY — Параметры ликвидности
# -----------------------------------------------------------------------------
liquidity:
  # Порог ликвидности (коэффициент торговых дней)
  threshold: 0.80  # ≥ 0.80 → Ликвидные
  
  # Ограничение Beta при импутации
  imputation_beta_clip:
    - 0.5
    - 3.0
  
  # Ограничение liquid-illiquid корреляций
  correlation_cap: 0.75
  
  # Премия за ликвидность (Liquidity Premium)
  liquidity_premium:
    0.80: 1.0   # Liquidity ≥ 0.80 → множитель 1.0
    0.60: 1.2   # Liquidity 0.60–0.80 → множитель 1.2
    0.40: 1.5   # Liquidity 0.40–0.60 → множитель 1.5
    0.0: 2.0    # Liquidity < 0.40 → множитель 2.0

# -----------------------------------------------------------------------------
# CRISIS — Кризисный режим (Freeze)
# -----------------------------------------------------------------------------
crisis:
  # Триггеры активации (любой из трёх)
  vix_threshold: 40           # VIX-RUS > 40
  imoex_drawdown: -0.20       # Просадка IMOEX < -20%
  correlation_spike: 0.90     # Средняя корреляция > 0.90
  
  # Длительность заморозки кластеров
  freeze_duration_days: 63    # 63 дня (квартал)
  
  # Логирование кризисных сигналов
  log_signals: true
  alert_on_activation: true

# -----------------------------------------------------------------------------
# RISK_METRICS — Метрики риска (VaR, PFE, EAD)
# -----------------------------------------------------------------------------
risk_metrics:
  var:
    confidence_levels: [0.95, 0.99]
    horizon_days: [1, 10, 252]
    
  pfe:
    horizon_days: 252         # 1 год
    confidence_level: 0.95
    ead_alpha: 1.4            # Коэффициент для EAD
    
  expected_shortfall:
    enabled: true
    confidence_level: 0.975

# -----------------------------------------------------------------------------
# HAIRCUTS — Параметры Haircuts по режимам
# -----------------------------------------------------------------------------
haircuts:
  base: 0.15  # Базовый haircut для акций (15%)
  
  by_regime:
    BULL_LOW: 0.10
    BULL_HIGH: 0.18
    BEAR_LOW: 0.17
    BEAR_HIGH: 0.23
    
  by_liquidity:
    liquid: 1.0
    illiquid: 1.5